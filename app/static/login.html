<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in – LXC Update Manager</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
</head>
<body class="login-page">
  <main class="login-box">
    <img class="login-logo" src="/static/logo.svg" alt="" width="56" height="56">
    <h1>LXC Update Manager</h1>
    <p class="muted">Please log in</p>
    <form id="login-form">
      <label>Username
        <input name="username" autocomplete="username" required autofocus value="admin">
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="err" role="alert" hidden></p>
      <p id="login-hint" class="muted" hidden></p>
      <button class="primary" type="submit">Log in</button>
    </form>
  </main>
  <footer class="site-footer">
    © 2026 StofflHD ·
    <a href="https://github.com/StofflHD/LUM-lxc-update-manager" target="_blank" rel="noopener">LUM on GitHub</a>
  </footer>
  <script src="/static/login.js"></script>
</body>
</html>
