<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in – LXC Update Manager</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <main class="login-box">
    <h1>LXC Update Manager</h1>
    <p class="muted">Please log in</p>
    <form id="login-form">
      <label>Username
        <input name="username" autocomplete="username" required autofocus value="admin">
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="err" role="alert" hidden></p>
      <p id="login-hint" class="muted" hidden></p>
      <button class="primary" type="submit">Log in</button>
    </form>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
